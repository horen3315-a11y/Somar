<script>
(()=>{
const $=i=>document.getElementById(i),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
ok=s=>typeof s=='string'&&/^data:(image|video|audio)\//.test(s),
G=[['#ff885e','#ff516a'],['#ffcd6a','#ffa85c'],['#82b1ff','#665fff'],['#a0de7e','#54cb68'],['#53edd6','#28c9b7'],['#72d5fd','#2a9ef1'],['#e0a2f3','#d669ed'],['#ff9aa2','#e8537a']],
E=['😀','😎','🦊','🐱','🐼','🦄','🚀','🎧','🌸','🔥','👻','🤖'],RX=/^[a-z][a-z0-9_]{2,19}$/,
S=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem(k)):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let M=S('me'),me,U=S('u')||{},IN=S('in')||{},un=S('un')||{},C={},cn={},peer,pr,rec,call,ring,st,ct,vid,srch,Q=Promise.resolve();
try{const t=localStorage.theme;if(t)document.documentElement.dataset.theme=t}catch(e){}
const idb=new Promise(r=>{try{const q=indexedDB.open('m',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}}),
dg=async k=>{const d=await idb;return d?new Promise(r=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}):S('x'+k)},
ds=async(k,v)=>{const d=await idb;d?d.transaction('s','readwrite').objectStore('s').put(v,k):S('x'+k,v)},
toast=t=>{$('ts').textContent=t;clearTimeout(toast.i);toast.i=setTimeout(()=>$('ts').textContent='',3500)},
tm=(t,l)=>{const d=new Date(t);return l&&Date.now()-t>864e5?d.toLocaleDateString('ru',{day:'numeric',month:'short'}):d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})},
rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)}),
shrink=(f,m,q)=>rd(f).then(u=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=u})),
av=(u,s)=>{u=u||{};const g=G[u.c|0]||G[0];return `<div class="av" style="width:${s}px;height:${s}px;font-size:${s*.45}px;background:linear-gradient(${g[0]},${g[1]})">${ok(u.p)?`<img src="${u.p}">`:esc(u.e||(u.name||'?')[0].toUpperCase())}</div>`},
qu=f=>{Q=Q.then(f).catch(()=>toast('Ошибка отправки'))},
row=(k,s,t='',n=0)=>`<div class="r" data-u="${esc(k)}">${av(U[k],54)}<div><b>${esc(U[k]?.name||k)}</b><small>${s}</small></div><time>${t}${n?`<br><span class="bd">${n>99?'99+':n}</span>`:''}</time></div>`,
U0=()=>({name:M.name,bio:M.bio,c:M.c,e:M.e,p:M.p});

function list(){if(!me)return;const q=$('q').value.trim().replace(/^@/,'').toLowerCase();let h='';
 if(q){for(const k in U)if(k.includes(q)||(U[k].name||'').toLowerCase().includes(q))h+=row(k,'@'+k);
  if(RX.test(q)&&q!=me&&!U[q])h+=`<div class="r" data-s="${q}"><b>🔎 Найти @${q} в сети</b></div>`}
 else Object.keys(IN).sort((a,b)=>IN[b].t-IN[a].t).forEach(k=>h+=row(k,(IN[k].f==me?'Вы: ':'')+esc(IN[k].last),tm(IN[k].t,1),un[k]));
 $('ls').innerHTML=h||`<p class="hn">${q?'Введите юзернейм полностью — найдём друга, если он в сети':'Пока нет чатов.<br>Найдите друга по @юзернейму в поиске.'}</p>`}
function head(){const u=U[peer];$('hd').innerHTML=av(u,40)+`<div><b>${esc(u?.name||peer)}</b><br><small>@${esc(peer)}</small></div>`}
function bub(m){const e=document.createElement('div');e.className='b '+(m.f==me?'o':'i');
 const T={img:'<img class="md">',vid:'<video class="md" controls playsinline></video>',voice:'<audio class="md" controls></audio>'}[m.k];
 e.innerHTML=(T||esc(m.x))+`<i>${m.w?'⏳ ':''}${tm(m.t)}</i>`;if(T&&ok(m.d))e.firstChild.src=m.d;return e}
const load=async p=>C[p]||(C[p]=(await dg('m:'+p))||[]);
function show(p){load(p).then(a=>{if(peer!=p)return;$('ms').innerHTML='';a.forEach(m=>$('ms').append(bub(m)));$('ms').scrollTop=1e9})}
function openChat(p){if(!history.state||!history.state.chat)try{history.pushState({chat:1},'')}catch(e){}peer=p;un[p]=0;S('un',un);$('q').value='';list();$('chat').classList.add('on');$('app').classList.add('op');$('ms').innerHTML='';head();show(p);conn(p)}
async function add(p,m){const a=await load(p);a.push(m);ds('m:'+p,a);
 const l=({text:m.x,img:'📷 Фото',vid:'🎬 Видео',voice:'🎤 Голосовое'}[m.k]||'').slice(0,60);
 IN[p]={t:m.t,last:l,f:m.f};S('in',IN);if(m.f!=me&&p!=peer){un[p]=(un[p]||0)+1;S('un',un)}
 list();if(p==peer){$('ms').append(bub(m));$('ms').scrollTop=1e9}}
async function out(p,m,d){m.f=me;m.t=Date.now();if(d)m.d=d;const c=cn[p],on=c&&c.open;if(!on)m.w=1;const x={...m};await add(p,m);if(on)c.send(x);else{conn(p);toast('Друг не в сети — отправим, когда он подключится')}}
async function flush(p){const a=await load(p);let n=0;a.forEach(m=>{if(m.w&&cn[p]&&cn[p].open){const{w,...x}=m;cn[p].send(x);delete m.w;n++}});if(n){ds('m:'+p,a);if(peer==p)show(p)}}

/* сеть (PeerJS: прямое соединение между друзьями) */
function conn(p){if(!pr||!pr.open||p==me||cn[p])return;setup(pr.connect('tgm-'+p,{reliable:true}))}
function setup(c){const p=c.peer.slice(4);cn[p]=c;
 c.on('open',()=>{c.send({k:'hi',p:U0()});flush(p)});
 c.on('data',d=>{if(!d||typeof d!='object')return;
  if(d.k=='hi'){const q=d.p||{};U[p]={name:String(q.name||p).slice(0,30),bio:String(q.bio||'').slice(0,80),c:q.c|0,e:String(q.e||'').slice(0,4),p:ok(q.p)?q.p:''};S('u',U);list();if(peer==p)head();if(srch==p){srch=0;openChat(p)}}
  else if(['text','img','vid','voice'].includes(d.k)&&(d.k=='text'||ok(d.d)))add(p,{k:d.k,x:String(d.x||'').slice(0,4000),d:d.d,t:+d.t||Date.now(),f:p})});
 c.on('close',()=>{if(cn[p]==c)delete cn[p]});c.on('error',()=>{})}
function net(nw){if(typeof Peer=='undefined')return toast('Нужен интернет для подключения');
 pr=new Peer('tgm-'+me);
 pr.on('open',()=>{Object.keys(U).concat(Object.keys(IN)).forEach(conn);toast('Вы в сети: @'+me)});
 pr.on('connection',c=>RX.test(c.peer.slice(4))?setup(c):c.close());
 pr.on('call',c=>{const p=c.peer.slice(4);if(call||ring||!RX.test(p)){c.close();return}ring=c;vid=!!c.metadata?.v;cui(p,vid?'Видеозвонок':'Голосовой звонок',1);
  c.on('close',()=>{if(ring==c){ring=null;cui(0)}else if(call==c)end()})});
 pr.on('disconnected',()=>setTimeout(()=>pr&&!pr.destroyed&&pr.reconnect(),2e3));
 pr.on('error',e=>{
  if(e.type=='unavailable-id'){pr.destroy();pr=null;if(nw){localStorage.removeItem('me');M=null;prof(1);$('er').textContent='Юзернейм занят — выберите другой'}else setTimeout(()=>net(0),5e3)}
  else if(e.type=='peer-unavailable'){const p=/tgm-([a-z0-9_]+)/.exec(e.message)?.[1];if(p){delete cn[p];if(srch==p){srch=0;toast('@'+p+' не найден или не в сети')}if(call&&!call.ok&&call.pn==p){end();toast('Друг не в сети')}}}
  else if(['network','server-error','socket-error','socket-closed'].includes(e.type))toast('Нет связи с сервером')});
 if(!net.i)net.i=setInterval(()=>pr&&pr.open&&Object.keys(U).forEach(conn),3e4)}

/* звонки */
function cui(p,s,inc){$('cl').hidden=!p;if(!p)return;$('ca').innerHTML=av(U[p],110);$('cn2').textContent=U[p]?.name||p;$('cs').textContent=s;$('ci').hidden=false;$('ac').hidden=!inc;$('mu').hidden=!!inc;$('cm').hidden=!!inc||!vid;$('lv').hidden=!vid}
function wire(c,p){c.pn=p;c.on('stream',s=>{$('rv').srcObject=s;c.ok=1;$('cs').textContent='Соединено';const t0=Date.now();clearInterval(ct);ct=setInterval(()=>{const q=((Date.now()-t0)/1e3)|0;$('cs').textContent=((q/60)|0)+':'+String(q%60).padStart(2,'0')},1e3);if(vid)$('ci').hidden=true});c.on('close',()=>{if(call==c)end()});c.on('error',()=>{if(call==c)end()})}
function end(){clearInterval(ct);const c=call,r=ring;call=ring=null;try{c&&c.close();r&&r.close()}catch(e){}st&&st.getTracks().forEach(t=>t.stop());st=null;$('rv').srcObject=$('lv').srcObject=null;cui(0)}
/* разрешения: своё окно → настоящий системный запрос (getUserMedia) */
const PN={microphone:'микрофону',camera:'камере'},PI={microphone:'🎤',camera:'📷'};let pm=0;
const dlg=(ic,t,d,y,n)=>new Promise(r=>{const m=$('pm'),a=$('pa'),b=$('pn'),f=v=>{m.hidden=true;a.onclick=b.onclick=null;r(v)};
 $('pi').textContent=ic;$('pt').textContent=t;$('pd').textContent=d;a.textContent=y;b.textContent=n||'';b.hidden=!n;a.onclick=()=>f(1);b.onclick=()=>f(0);m.hidden=false}),
pst=async n=>{try{return(await navigator.permissions.query({name:n})).state}catch(e){return(S('pg')||{})[n]?'granted':'prompt'}},
blocked=async n=>{await dlg('🚫','Нет доступа к '+n.map(x=>PN[x]).join(' и '),'Включите доступ: Настройки телефона → Приложения → SoMar beta → Разрешения. Если там пусто — откройте Chrome → ⋮ → Настройки → Настройки сайтов → Микрофон и Камера (или значок замка рядом с адресом). Если приложение собрано конвертером без камеры и микрофона, его нужно пересобрать с разрешениями CAMERA и RECORD_AUDIO.','Понятно');return null};
async function media(mic,cam){
 if(pm)return null;pm=1;
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){await dlg('⚠️','Звонки недоступны','Микрофон и камера работают только по защищённому адресу (HTTPS) или внутри установленного приложения.','Понятно');return null}
  const need=[];if(mic)need.push('microphone');if(cam)need.push('camera');
  const sts=await Promise.all(need.map(pst)),bad=need.filter((n,i)=>sts[i]=='denied');
  if(bad.length)return await blocked(bad);
  /* без своего окна: getUserMedia сразу вызывает системный запрос Android (как в Telegram) */
  try{const s=await navigator.mediaDevices.getUserMedia({audio:!!mic,video:!!cam}),g=S('pg')||{};need.forEach(n=>g[n]=1);S('pg',g);return s}
  catch(e){
   if(e.name=='NotAllowedError'||e.name=='SecurityError')return await blocked(need);
   toast(e.name=='NotFoundError'||e.name=='OverconstrainedError'?'Микрофон или камера не найдены':'Микрофон или камера заняты другим приложением')}

  mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());const r=rec;clearInterval(r.iv);rec=null;ui();if(r.send)qu(async()=>out(p,{k:'voice'},await rd(new Blob(ch,{type:mr.mimeType}))))};
  mr.start();ui()}catch(e){s.getTracks().forEach(t=>t.stop());if(rec)clearInterval(rec.iv);rec=null;ui();toast('Запись голоса не поддерживается на этом устройстве')}}
